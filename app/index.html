<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motor Eléctrico — Laboratorio 3D</title>

  <!-- Supabase Credentials (para Sala en vivo y Snapshots) -->
  <meta name="supabase-url" content="https://znampiflhxbrhakedlit.supabase.co" />
  <meta name="supabase-anon-key" content="sb_publishable_adYL72YsHjgbpdunGi6k7w_yfvyXahe" />

  <!-- Tailwind CSS (CDN) — necesario para el nuevo Preloader y componentes UI -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary":             "var(--color-primary)",
            "primary-light":       "var(--color-primary-light)",
            "on-primary":          "#ffffff",
            "primary-container":   "var(--color-primary-container)",
            "on-primary-container":"var(--color-on-primary-container)",
            "surface":             "#0b1326",
            "on-surface":          "#ffffff",
            "surface-variant":     "var(--color-surface-variant)",
            "on-surface-variant":  "var(--color-on-surface-variant)",
            "surface-container":   "var(--color-surface-container)",
            "secondary-container": "var(--color-secondary-container)",
            "background":          "#0b1326",
            "on-surface-dark":     "#1a1c1e",
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "display": ["Inter"],
            "headline-lg": ["Inter"],
            "headline-lg-mobile": ["Inter"],
            "body-md": ["Inter"],
            "label-sm": ["Inter"],
          },
          fontSize: {
            "label-sm":           ["13px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "500" }],
            "headline-lg":        ["32px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-lg-mobile": ["24px", { lineHeight: "1.2", fontWeight: "600" }],
            "body-md":            ["16px", { lineHeight: "1.6", fontWeight: "400" }],
          },
          spacing: {
            "container-padding": "24px",
            "margin-lg":         "40px",
          },
        },
      },
    };
  </script>

  <!-- Google Fonts — Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">

  <!-- Fuentes legacy (Rubik para componentes existentes) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap">

  <!-- CSS Variables — Fuente única de verdad para colores del tema -->
  <style>
    :root {
      --color-primary:           #0066ff;
      --color-primary-light:     #66aaff;
      --color-primary-rgb:       0, 102, 255;
      --color-on-primary:        #ffffff;
      --color-primary-container: #003cbf;
      --color-surface:           #0b1326;
      --color-on-surface:        #ffffff;
      --color-on-surface-variant:#a0a0a0;
      --color-text-dark:         #1a1c1e;
      --glow-primary:            rgba(0, 102, 255, 0.45);
      --glow-primary-strong:     rgba(0, 102, 255, 0.75);
      --gradient-primary:        linear-gradient(135deg, #0066ff 0%, #003cbf 100%);
    }
    body { font-family: 'Inter', 'Rubik', sans-serif; }
  </style>

  <!-- Estilos globales (sistema de idiomas, layout base) -->
  <link rel="stylesheet" href="./css/main.css" />

  <!-- Estilos de componentes (modales, ayudas, preloader, etc.) -->
  <link rel="stylesheet" href="./css/components/Componentes.css" />

  <!-- Estilos del menú lateral -->
  <link rel="stylesheet" href="./js/components/MenuLateral/MenuLateral.css" />
</head>

<body class="lang-es">

  <!-- =============================================
       CAPA 1: Motor 3D (Verge3D en iframe)
       ============================================= -->
  <iframe
    id="v3d-container"
    title="Laboratorio 3D"
    style="position:fixed; top:0; left:0; width:100%; height:100%; border:none; z-index:1;"
  ></iframe>

  <!-- =============================================
       CAPA 2: UI Overlay (pointer-events: none)
       Los contenedores internos activan sus propios eventos
       ============================================= -->
  <div id="ui-overlay">

    <!-- Preloader -->
    <div id="preloader-container"></div>

    <!-- Vista Principal -->
    <div id="vista-principal-container" style="display:none;"></div>

    <!-- Botón retroceso -->
    <div id="retroceso-container"></div>

    <!-- Pantalla aviso mobile -->
    <div id="mobile-container"></div>

    <!-- Modales (ocultos al inicio, se muestran al presionar los botones) -->
    <div id="modal-ayuda-container"     style="display:none;"></div>
    <div id="modal-objetivos-container" style="display:none;"></div>
    <div id="modal-equipo-container"    style="display:none;"></div>


  </div>

  <!-- Input oculto de estado (compatibilidad con visual_logic.js) -->
  <input id="estado_animacion" value="0" style="display:none;" />
  <span id="loading_percentage" style="display:none;">0%</span>

  <!-- Script principal (ES6 Module) -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
